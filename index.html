<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>BSU Equipment Borrowing System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f8fafc;--card:#fff;--ink:#17243b;--mute:#57657b;--navy:#0b2545;--on:#fff;--line:#cfd9e8;--soft:#e2e8f0;--tint:#f1f5fb;--sel:#f5f9ff;
--ok:#2e7d32;--okb:#e8f5e9;--warn:#875b12;--warnb:#fff5df;--bad:#a33636;--badb:#fceeee;--bl:#1e56c8;--blb:#f1f5fb;
--btn:#1e56c8;--btn-h:#1949ad;--btn-a:#0f2f73;--btn-d:#dbe3f0;--btn-dt:#737a87;--btn-t:#fff}
:root{color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1420;--card:#16202f;--ink:#eef2f8;--mute:#a9b4c6;--navy:#a9c8ff;--on:#0b2545;--line:#34445c;--tint:#1c2a40;--soft:#25344d;--sel:#1c2a40;--ok:#7fdc9d;--okb:#17301f;--warn:#ffd27a;--warnb:#3a2d0e;--bad:#ff9d9d;--badb:#3a1818;--bl:#a9c8ff;--blb:#1c2a40;--btn:#1e56c8;--btn-h:#1949ad;--btn-a:#0f2f73;--btn-d:#25344d;--btn-dt:#7d8aa0;--btn-t:#fff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1420;--card:#16202f;--ink:#eef2f8;--mute:#a9b4c6;--navy:#a9c8ff;--on:#0b2545;--line:#34445c;--tint:#1c2a40;--soft:#25344d;--sel:#1c2a40;--ok:#7fdc9d;--okb:#17301f;--warn:#ffd27a;--warnb:#3a2d0e;--bad:#ff9d9d;--badb:#3a1818;--bl:#a9c8ff;--blb:#1c2a40;--btn:#1e56c8;--btn-h:#1949ad;--btn-a:#0f2f73;--btn-d:#25344d;--btn-dt:#7d8aa0;--btn-t:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,"Segoe UI",Arial,sans-serif}
header{background:var(--navy);color:var(--on);padding:14px 18px;display:flex;gap:12px;align-items:center}
header b{background:var(--on);color:var(--navy);border-radius:8px;padding:8px 10px;font-size:15px}header small{opacity:.85}
main{max-width:720px;margin:0 auto;padding:18px}h1{font-size:26px;line-height:1.2;margin:6px 0 10px}h2{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--soft);border-radius:12px;padding:16px;margin-bottom:14px}
.mu{color:var(--mute);font-size:14px}.step{color:var(--mute);font-size:13px;font-weight:600;margin:0}
label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
input,select,textarea{display:block;width:100%;min-height:48px;margin-top:6px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px}
textarea{min-height:88px}input:disabled,select:disabled{background:var(--tint);color:var(--mute)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.bad{border-color:var(--bad)!important}
button{font:inherit;font-weight:600;min-height:48px;min-width:48px;padding:0 16px;border-radius:10px;border:1.5px solid var(--navy);background:var(--card);color:var(--ink);cursor:pointer}
button:active{transform:translateY(1px)}.w{width:100%;margin-bottom:10px}
.pri{width:100%;margin-bottom:10px}
.pri,.chips button[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:var(--btn-t)}
@media(hover:hover){button.pri:hover:not(:disabled),.chips button[aria-pressed=true]:hover:not(:disabled){background:var(--btn-h);border-color:var(--btn-h)}}
button.pri:active:not(:disabled),.chips button[aria-pressed=true]:active:not(:disabled){background:var(--btn-a);border-color:var(--btn-a)}
button:disabled,button.pri:disabled{background:var(--btn-d);border-color:var(--btn-d);color:var(--btn-dt);cursor:not-allowed;transform:none}.dng{border-color:var(--bad);color:var(--bad)}
.back{display:inline-flex;align-items:center;min-height:48px;font-weight:600;cursor:pointer}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}.chk input{width:28px;height:28px;min-height:28px;margin:0;flex:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:15px}.kv span{color:var(--mute);font-size:13px;display:block}.kv .f{grid-column:1/-1}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--tint);color:var(--navy)}
.Available,.Returned{background:var(--okb);color:var(--ok)}.Approved{background:var(--tint);color:var(--navy)}.Pending,.Awaiting,.Return{background:var(--warnb);color:var(--warn)}.Maintenance,.Rejected{background:var(--badb);color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tile{background:var(--card);border:1px solid var(--soft);border-radius:12px;padding:12px}.tile b{font-size:28px;display:block;line-height:1.1}.tile span{font-size:13px;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.err{background:var(--badb);color:var(--bad);border-radius:10px;padding:12px;margin-bottom:12px;font-weight:600}
.note{background:var(--tint);border-radius:10px;padding:12px;font-size:14px;margin-bottom:12px}
.nav{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.acts{display:flex;gap:10px;margin-top:10px}.acts button{flex:1}
.bar{height:10px;background:var(--tint);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy)}
.qr{width:120px;height:120px;margin:8px auto;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute);font-weight:700;text-align:center}
.tl{border-left:3px solid var(--line);padding-left:12px;margin:0}.tl p{margin:0 0 10px}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px}
@media(min-width:600px){.ov{align-items:center;padding:16px}.md{border-radius:16px}}
@media print{header,.noprint{display:none}}
</style></head><body>
<div id="app"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),K="bsu-ebs-v2";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

T("BSU-2026-00136","2024001872","Andrea Santos","0917 482 6310","andrea.santos@bulsu.edu.ph","Student","EQ-CAM-002","2026-10-07","2026-10-09","Returned",{handover:"2026-10-09",after:"Good",notes:"No new damage.",final:"Good — no new damage; all accessories returned.",by:"Maria Dela Cruz",hist:[["07 Oct 2026, 9:00 AM","Request submitted · Pending"],["09 Oct 2026, 10:00 AM","Staff verified · Returned / Available"]]}),
T("BSU-2026-00139","2025002116","Mia Reyes","0912 000 1122","mia.reyes@bulsu.edu.ph","Student","EQ-CAM-003","2026-10-10","2026-10-10","Returned",{handover:"2026-10-10",after:"Good",notes:"OK.",final:"Good — complete.",by:"Maria Dela Cruz",hist:[]}),

T("BSU-2026-00144","2024001903","Luis Garcia","0915 300 4488","luis.garcia@bulsu.edu.ph","Student","EQ-PRJ-002","2026-10-12","2026-10-13","Rejected",{reason:"Equipment reserved for a campus event.",hist:[]})],
log:[{t:"System",who:"System",act:"Database initialised with 12 equipment records"}]});
let S,API=false;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.eq)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(API)fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)}).catch(()=>{})};
const now=()=>new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
const today=()=>new Date().toISOString().slice(0,10),fd=d=>d?new Date(d+"T00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";
const log=(who,act)=>S.log.unshift({t:now(),who,act});
const eqOf=id=>S.eq.find(e=>e.id===id),txOf=id=>S.tx.find(t=>t.id===id),ADMIN="Maria Dela Cruz";
const tag=s=>`<span class="tag ${s.split(" ")[0]}">${esc(s)}</span>`;
const kv=a=>`<div class="kv">${a.map(([k,v,f])=>`<div class="${f?"f":""}"><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;
const back=(v,l)=>`<a class="back" tabindex="0" role="button" data-a="go" data-v="${v}">← ${l}</a>`;
const lt=(t,s)=>{t.hist.push([now(),s])};
let V="home",ADM=false,B={},R={},D={},UI={cur:"",q:"",tab:"Pending",role:"All",iq:"",is:"All",it:"All",lim:5,my:"",mt:"Pending",open:"",rep:null,rv:null,all:false};
function modal(h){$("#modal").innerHTML=h?`<div class="ov" role="dialog" aria-modal="true"><div class="md">${h}</div></div>`:""}
const msg=(t,m,k)=>modal(`<h2>${t}</h2>${k?`<div class="err">${m}</div>`:`<p>${m}</p>`}<button class="pri" data-a="close">OK</button>`);
function render(){if(V[0]==="a"&&V!=="alogin"&&!ADM)V="alogin";
$("#app").innerHTML=`<header><b>BSU</b><div><strong>Bulacan State University</strong><br><small>${V[0]==="a"?"Lab administrator service":"Equipment borrowing service"}</small></div></header><main>${VW[V]()}</main>`}
const go=(v,x)=>{V=v;if(x)Object.assign(UI,x);render();scrollTo(0,0)};
const val=id=>($(id)?.value||"").trim();
const bad=(ids,m)=>{ids.forEach(i=>document.querySelectorAll(i).forEach(x=>x.classList.add("bad")));const e=$("#err");if(e)e.innerHTML=`<div class="err" role="alert">${m}</div>`;$(ids[0])?.focus();return false};

const eqCard=(e,x="")=>`<div class="card"><h2>${esc(e.name)} ${tag(e.state)}</h2>${kv([["Equipment ID",e.id],["Type",e.type],["Condition",e.cond],["Inventory state",e.state],["Accessories",esc(e.acc.join(", ")),1],["Condition before",esc(e.note),1]])}${x}</div>`;
const tcard=t=>`<div class="card">${tag(t.status)}<h2 style="margin-top:8px">${esc(eqOf(t.eq).name)}</h2>${kv([["Transaction ID",t.id],["Borrower",esc(t.name)+" · "+t.role],["Borrow → Return",fd(t.from)+" → "+fd(t.to)]])}</div>`;
const rec=t=>{const e=eqOf(t.eq);return `<div class="card"><h2>Borrower Information</h2>${kv([["Name",esc(t.name)],["Borrower ID",esc(t.bid)],["Role",t.role],["Contact number",esc(t.phone)],["Email",esc(t.email),1]])}</div>
<div class="card"><h2>Equipment Details</h2>${kv([["Equipment ID",e.id],["Name",esc(e.name)],["Type",e.type],["Condition",e.cond],["Inventory state",tag(e.state)],["Accessories",esc(e.acc.join(", "))]])}</div>
<div class="card"><h2>Borrowing Schedule</h2>${kv([["Borrow date",fd(t.from)],["Expected return",fd(t.to)],["Actual return",t.handover?fd(t.handover):"Not yet returned"]])}</div>
<div class="card"><h2>Preserved condition notes</h2>${kv([["Before · Recorded at checkout",esc(e.note),1],["Borrower-reported after",t.notes?esc(t.after+" — "+t.notes):"Not yet recorded",1],["Final after · Staff inspected",t.final?esc(t.final):"Not yet recorded",1]])}${t.by?`<p class="mu">Inspected by ${esc(t.by)}</p>`:""}${t.reason?`<div class="note"><b>Rejection reason:</b> ${esc(t.reason)}</div>`:""}</div>
<div class="card"><h2>Transaction lifecycle</h2><div class="tl">${t.hist.map(h=>`<p class="mu">${esc(h[0])}<br><b style="color:var(--ink)">${esc(h[1])}</b></p>`).join("")||'<p class="mu">No history recorded.</p>'}</div></div>`};
const VW={
home:()=>`<h1>Equipment Borrowing System</h1><p>Request campus equipment for your classes and university activities in three simple steps.</p>

b3:()=>{const e=eqOf(B.eq);return `${back("b2","Equipment selection")}<p class="step">Step 3 of 3 · Review</p><h1>Borrowing Review</h1><p class="mu">Check your request before submitting it for staff approval.</p>
<div class="card"><h2>Borrower Information</h2>${kv([["Borrower Name",esc(B.name)],["Borrower ID",esc(B.bid)],["Role",B.role],["Contact Number",esc(B.phone)],["Email Address",esc(B.email),1]])}</div>
<div class="card"><h2>Equipment Information</h2>${kv([["Equipment ID",e.id],["Equipment Name",esc(e.name)],["Equipment Type",e.type],["Status (at request)",e.state],["Condition (at request)",e.cond],["Accessories",esc(e.acc.join(", "))]])}</div>
<div class="card"><h2>Borrowing Schedule</h2>${kv([["Borrow Date",fd(B.from)],["Return Date",fd(B.to)]])}</div>
<div class="card"><h2>Condition &amp; Return Status</h2>${kv([["Condition Before (at checkout)",esc(e.note),1],["Condition After (at return)","Not yet returned",1]])}</div>
<label class="chk"><input id="cf" type="checkbox"> I confirm the condition and accessories</label><div id="err"></div><button class="w" data-a="go" data-v="b1">Edit</button><button class="pri" id="sb" data-a="n3" disabled>Submit for Approval</button>`},
slip:()=>{const t=txOf(UI.cur),e=eqOf(t.eq);return `<p class="step">Request submitted</p><h1>Borrowing Slip</h1><p class="mu">Keep this slip. Your request is pending staff approval.</p>

<div class="card"><h2>Borrower Information</h2>${kv([["Borrower ID",esc(t.bid)],["Name",esc(t.name)],["Contact Number",esc(t.phone)],["Email",esc(t.email)],["Role",t.role]])}</div>
<div class="card"><h2>Equipment Details</h2>${kv([["Equipment ID",e.id],["Name",esc(e.name)],["Type",e.type],["Equipment Status",tag(e.state)],["Condition Before",esc(e.note),1],["Condition After","Not yet recorded",1]])}<b>Accessories</b>${e.acc.map(a=>`<label class="chk"><input type="checkbox"> ${esc(a)}</label>`).join("")}</div>
